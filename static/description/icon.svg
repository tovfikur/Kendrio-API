<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>

  <!-- Network nodes (background) -->
  <circle cx="18" cy="22" r="4" fill="#3B82F6" opacity="0.4"/>
  <circle cx="110" cy="22" r="4" fill="#3B82F6" opacity="0.4"/>
  <circle cx="18" cy="106" r="4" fill="#F97316" opacity="0.4"/>
  <circle cx="110" cy="106" r="4" fill="#F97316" opacity="0.4"/>
  <circle cx="64" cy="14" r="3" fill="#3B82F6" opacity="0.5"/>
  <circle cx="14" cy="64" r="3" fill="#3B82F6" opacity="0.5"/>
  <circle cx="114" cy="64" r="3" fill="#F97316" opacity="0.5"/>
  <circle cx="64" cy="114" r="3" fill="#F97316" opacity="0.5"/>

  <!-- Connection lines (background) -->
  <line x1="18" y1="22" x2="64" y2="14" stroke="#3B82F6" stroke-width="0.8" opacity="0.25"/>
  <line x1="64" y1="14" x2="110" y2="22" stroke="#3B82F6" stroke-width="0.8" opacity="0.25"/>
  <line x1="18" y1="22" x2="14" y2="64" stroke="#3B82F6" stroke-width="0.8" opacity="0.25"/>
  <line x1="110" y1="22" x2="114" y2="64" stroke="#F97316" stroke-width="0.8" opacity="0.25"/>
  <line x1="14" y1="64" x2="18" y2="106" stroke="#3B82F6" stroke-width="0.8" opacity="0.25"/>
  <line x1="114" y1="64" x2="110" y2="106" stroke="#F97316" stroke-width="0.8" opacity="0.25"/>
  <line x1="18" y1="106" x2="64" y2="114" stroke="#F97316" stroke-width="0.8" opacity="0.25"/>
  <line x1="64" y1="114" x2="110" y2="106" stroke="#F97316" stroke-width="0.8" opacity="0.25"/>

  <!-- Center hexagon -->
  <polygon points="64,30 84,41 84,63 64,74 44,63 44,41" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner glow ring -->
  <circle cx="64" cy="52" r="22" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>

  <!-- "K" letterform -->
  <g filter="url(#glow)">
    <!-- K left vertical -->
    <rect x="48" y="34" width="5" height="36" rx="2" fill="url(#accent)"/>
    <!-- K upper diagonal -->
    <polygon points="53,52 72,34 78,34 60,52" fill="url(#accent)"/>
    <!-- K lower diagonal -->
    <polygon points="53,52 78,70 72,70 53,55" fill="url(#accent)"/>
  </g>

  <!-- Orange accent dot -->
  <circle cx="80" cy="42" r="4" fill="#F97316" opacity="0.9" filter="url(#glow)"/>

  <!-- Bottom label -->
  <rect x="20" y="90" width="88" height="18" rx="4" fill="#3B82F6" opacity="0.15"/>
  <text x="64" y="103" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700"
        fill="#93C5FD" text-anchor="middle" letter-spacing="2">API EXPLORER</text>
</svg>
