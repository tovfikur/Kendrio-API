<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F2544;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1E40AF" stroke-width="0.4" opacity="0.2">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="650" y1="0" x2="650" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Ambient glow blobs -->
  <circle cx="150" cy="200" r="120" fill="#3B82F6" opacity="0.05"/>
  <circle cx="650" cy="200" r="140" fill="#F97316" opacity="0.06"/>

  <!-- Network nodes (right side decorative) -->
  <g opacity="0.7">
    <circle cx="560" cy="80" r="5" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="650" cy="140" r="7" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="720" cy="90" r="4" fill="#F97316" filter="url(#glow)"/>
    <circle cx="770" cy="160" r="6" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="680" cy="220" r="5" fill="#F97316" filter="url(#glow)"/>
    <circle cx="740" cy="290" r="4" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="620" cy="310" r="6" fill="#F97316" filter="url(#glow)"/>
    <circle cx="560" cy="260" r="5" fill="#3B82F6" filter="url(#glow)"/>
    <circle cx="590" cy="180" r="4" fill="#F97316" filter="url(#glow)"/>
    <circle cx="760" cy="340" r="5" fill="#3B82F6" filter="url(#glow)"/>
  </g>

  <!-- Network connection lines -->
  <g stroke="#3B82F6" stroke-width="1" opacity="0.35">
    <line x1="560" y1="80" x2="650" y2="140"/>
    <line x1="650" y1="140" x2="720" y2="90"/>
    <line x1="720" y1="90" x2="770" y2="160"/>
    <line x1="770" y1="160" x2="680" y2="220"/>
    <line x1="680" y1="220" x2="740" y2="290"/>
    <line x1="740" y1="290" x2="620" y2="310"/>
    <line x1="620" y1="310" x2="560" y2="260"/>
    <line x1="560" y1="260" x2="590" y2="180"/>
    <line x1="590" y1="180" x2="650" y2="140"/>
    <line x1="650" y1="140" x2="680" y2="220"/>
    <line x1="560" y1="80" x2="590" y2="180"/>
    <line x1="770" y1="160" x2="740" y2="290"/>
    <line x1="760" y1="340" x2="620" y2="310"/>
    <line x1="760" y1="340" x2="740" y2="290"/>
  </g>

  <!-- Left: Logo mark -->
  <g transform="translate(55, 130)">
    <!-- Hexagon outline -->
    <polygon points="60,0 104,25 104,75 60,100 16,75 16,25"
             fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
    <!-- K letterform -->
    <rect x="38" y="22" width="8" height="56" rx="3" fill="url(#blueGrad)"/>
    <polygon points="46,50 78,22 88,22 58,50" fill="url(#blueGrad)"/>
    <polygon points="46,50 88,78 78,78 46,54" fill="url(#blueGrad)"/>
    <!-- Orange dot accent -->
    <circle cx="82" cy="30" r="6" fill="#F97316" filter="url(#glow)"/>
  </g>

  <!-- Divider line -->
  <line x1="195" y1="130" x2="195" y2="270" stroke="#334155" stroke-width="1"/>

  <!-- Main title -->
  <text x="220" y="185" font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-size="42" font-weight="800" fill="white" letter-spacing="-1">
    Kendrio
  </text>
  <text x="220" y="230" font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-size="42" font-weight="800" fill="url(#blueGrad)" letter-spacing="-1">
    API Explorer
  </text>

  <!-- Subtitle -->
  <text x="220" y="265" font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-size="16" fill="#94A3B8" letter-spacing="0.5">
    Zero-config introspection · OpenAPI 3.0 · Postman · Live RPC recorder
  </text>

  <!-- Feature badges -->
  <g transform="translate(220, 295)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#1E3A5F"/>
    <circle cx="16" cy="14" r="5" fill="#3B82F6"/>
    <text x="27" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#93C5FD" font-weight="600">OpenAPI 3.0</text>

    <!-- Badge 2 -->
    <rect x="115" y="0" width="100" height="28" rx="14" fill="#1E3A5F"/>
    <circle cx="131" cy="14" r="5" fill="#F97316"/>
    <text x="142" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FDBA74" font-weight="600">Postman V2.1</text>

    <!-- Badge 3 -->
    <rect x="225" y="0" width="90" height="28" rx="14" fill="#1E3A5F"/>
    <circle cx="241" cy="14" r="5" fill="#10B981"/>
    <text x="252" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6EE7B7" font-weight="600">Swagger UI</text>

    <!-- Badge 4 -->
    <rect x="325" y="0" width="100" height="28" rx="14" fill="#1E3A5F"/>
    <circle cx="341" cy="14" r="5" fill="#8B5CF6"/>
    <text x="352" y="19" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#C4B5FD" font-weight="600">RPC Recorder</text>
  </g>

  <!-- Top-right: Odoo 17 badge -->
  <g transform="translate(670, 28)">
    <rect width="110" height="36" rx="8" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <text x="55" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#93C5FD"
          text-anchor="middle" font-weight="600" letter-spacing="1">COMPATIBLE WITH</text>
    <text x="55" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white"
          text-anchor="middle" font-weight="800">Odoo 17</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="378" width="800" height="22" fill="#0A1628" opacity="0.8"/>
  <text x="400" y="393" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#475569"
        text-anchor="middle" letter-spacing="2">KENDRIO · LGPL-3 · github.com/tovfikur/Kendrio-API</text>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="3">
    <linearGradient id="topLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#60A5FA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1"/>
    </linearGradient>
  </rect>
  <rect x="0" y="0" width="800" height="3" fill="url(#topLine)"/>
</svg>
